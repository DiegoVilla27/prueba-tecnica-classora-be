spring.application.name=pos
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
# Behind Render's proxy: trust X-Forwarded-* headers (client IP for rate limiting, https URLs)
server.forward-headers-strategy=framework

# Perfil activo por defecto si no se pasa ninguno
spring.profiles.active=local

# Persistencia: el esquema lo define Flyway, Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger
springdoc.swagger-ui.path=/api-docs/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs
application.version=1.0.0
application.name=Classora POS API

# JWT (duraciones; los secretos van en cada perfil)
security.jwt.exp-secret=3600
security.jwt.exp-refresh=604800

# Rate Limiting (por cliente y minuto; el login tiene su propio bucket más estricto)
rate-limiting.enabled=true
rate-limiting.capacity=300
rate-limiting.refill-tokens=300
rate-limiting.refill-minutes=1
rate-limiting.login-capacity=10

# Actuator: solo health (lo usa Render)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
