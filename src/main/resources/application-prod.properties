# prod: Render + Neon (rama main).
# Los valores sensibles NO se commitean: el placeholder ${...} lo resuelve Spring con las
# variables de entorno definidas en el servicio de Render (pos-api-prod).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.refresh=${JWT_REFRESH_SECRET}

# CORS: dominio de Vercel de este entorno
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cajero sembrado (cuenta demo para probar el entorno)
seed.cashier.first-name=Ana
seed.cashier.last-name=L\u00f3pez
seed.cashier.email=cajero@pos.prod
seed.cashier.password=${SEED_CASHIER_PASSWORD}
