# Docker: contenedor en la red externa shared-network, global_postgres por nombre
spring.datasource.url=jdbc:postgresql://global_postgres:5432/pos_db
spring.datasource.username=user
spring.datasource.password=password

# JWT (solo para desarrollo local en contenedor)
security.jwt.secret=docker-access-secret-0123456789abcdefghijkl
security.jwt.refresh=docker-refresh-secret-0123456789abcdefghijk

# CORS
cors.allowed-origins=http://localhost:[*]

# Cajero sembrado
seed.cashier.first-name=Ana
seed.cashier.last-name=L\u00f3pez
seed.cashier.email=cajero@pos.local
seed.cashier.password=cajero1234
